<!DOCTYPE>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>sign up - SO DAWG</title>
  <script src=" https://cdn.tailwindcss.com"></script"></link>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'custom-green': '#16a34a'
          }
        }
      }
    }
  </script>
</head>

<body class="min-hscreen  flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="p-8">
      <div class="text-center mb-8">
        <div class="inline-block p-3 bg-green-50 rounded-full mb-4">
          <h1 class="text-2xl font-bold text-green-600">SO-DAWG</h1>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Welcome to our learning website</h2>
        <p class="text-gray-500 mt-1">Sign up to make your amazing learning journey</p>
      </div>

      <form id="loginForm">
        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-grey-700 mb-2">User Name</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input type="text" id="user"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent"
              placeholder="User name" required>
          </div>
        </div>
        <div class="mb-6">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-envelope text-gray-400"></i>
            </div>
            <input type="email" id="email"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent"
              placeholder="your@email.com" required>
          </div>
        </div>
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input type="password" id="password"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent"
              placeholder="••••••••" required>
          </div>
        </div>
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Phone number</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-lock text-gray-400"></i>
            </div>
            <input type="" id="phone number"
              class="w-full pl-10 pr-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent"
              placeholder="+855********" required>
          </div>
        </div>
        <button type="submit"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-md hover:shadow-lg">
          Sign up
        </button>
      </form>
    </div>
    <div class="px-8 py-4 bg-gray-50 border-t border-gray-200">
      <div class="flex items-center justify-center space-x-4">
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-200 hover:bg-gray-300 transition-colors">
          <i class="fab fa-google text-lg text-gray-700"></i>
        </button>
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-200 hover:bg-gray-300 transition-colors">
          <i class="fab fa-facebook text-lg text-gray-700"></i>
        </button>
        <button
          class="flex items-center justify-center w-10 h-10 rounded-full bg-gray-200 hover:bg-gray-300 transition-colors">
          <i class="fab fa-github text-lg text-gray-700"></i>
        </button>
      </div>
    </div>
  </div>
</body>

</html>
