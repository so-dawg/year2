<!DOCTYPE html>
<html>
  <head>
    <meta name="login" content="Create account">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Create Account</h1>
    <form>
      <div class="container">
        <div class="items">
          <label class="label">
            first name*<br>
            <input type="text" name="First name" >
          </label>
        </div>
        <div class="items">
          <label class="label">
            last name*<br>
            <input type="text" name="Last name" >
          </label>
        </div>
        <div class="items" id="email">
          <label class="label">email*<br><input type="gmail" id="emails"></label>
        </div>
        <div class="items">
          <label class="label">password*<br><input type="password"></label>
        </div>
        <div class="items">
          <label class="label">confirm password*<br><input type="password"></label>
        </div>
        <div class="items">
          <label class="label">
            gender*<br>
            <div class="item">
              <input type="radio" id="male">
              <label for="male">male</label>
              <input type="radio" id="female">
              <label for="female">female</label>
            </div>
          </label>
        </div>
        <div class="items">
          <label class="label">
            hobbie*<br>
            <div class="item">
              <input type="checkbox" name="music" id="music">
              <label for="music">music</label>
              <input type="checkbox" name="sports" id="sport">
              <label for="sport">sport</label>
              <input type="checkbox" name="travels" id="travels">
              <label for="travels">travel</label>
              <input type="checkbox" name="movie" id="movie">
              <label for="movie">movie</label>
            </div>
          </label>
        </div>
        
      <button type="submit">submit</button>
      </div>
    </form>
  </body>
</html>
