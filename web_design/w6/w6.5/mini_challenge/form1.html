<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="text" id="focused">
    <button type="submit">submit</button>
    <input type="text" name="search" id="search">

    <form>
        <div>
            <label>
                <input type="checkbox" id="terms" name="terms" value="accepted">
                Accept terms and conditions
            </label>
        </div>

        <div>
            <label>
                <input type="checkbox" id="newsletter" name="newsletter" value="subscribed">
                Subscribe to newsletter
            </label>
        </div>

        <div>
            <label>
                <input type="checkbox" id="updates" name="updates" value="yes">
                Receive product updates
            </label>
        </div>

        <div>
            <label>
                <input type="checkbox" id="marketing" name="marketing" value="yes">
                Receive marketing emails
            </label>
        </div>

        <div>
            <label>
                <input type="checkbox" id="disabled" name="disabled" value="disabled" disabled>
                Disabled checkbox (for reference)
            </label>
        </div>
    </form>
</body>
</html>
