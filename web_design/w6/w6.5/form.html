<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>form</title>
  </head>
  <body>
    
    <input type="text" >
    <!-- Define a one-line input field for text input -->

    <input type="radio" name="gender">
    <!-- Allows the user to select one option from a set -->

    <input type="checkbox" >
    <!-- Allows the user to select multiple options inpendently -->

    <input type="range" min="0" max="100">
    <!-- Lets the user choose a numeric value with a slider -->

    <input type="submit" value="submit">
    <!-- Creates a button to submit the form -->

    <textarea rows="4" cols="30"></textarea>
    <!-- A multi-line text input field -->
    
    <select>
      <option>One</option>
      <option>Two</option>
    </select> 
    <!-- a dropdown list of options -->

    <input type="color">
    <!-- lets user pick color -->

    <input type="file">
    <!-- Allows users to choose and upload a file -->
    
  </body>
</html>
